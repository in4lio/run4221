name: Bootstrap Production Data

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Data action to run"
        required: true
        default: "seed-prompts"
        type: choice
        options:
          - seed-prompts
          - reset-and-seed-suggestions
      private_ref:
        description: "Branch, tag, or SHA in in4lio/run4221-private"
        required: true
        default: "main"
        type: string
      confirm_reset:
        description: "Required only for reset-and-seed-suggestions"
        required: false
        default: ""
        type: string

concurrency:
  group: production-mutation
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap production data
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Validate reset confirmation
        if: ${{ inputs.action == 'reset-and-seed-suggestions' }}
        shell: bash
        env:
          CONFIRM_RESET: ${{ inputs.confirm_reset }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_RESET" != "RESET_SUGGESTION_BOOTSTRAP" ]]; then
            echo "reset-and-seed-suggestions requires confirm_reset=RESET_SUGGESTION_BOOTSTRAP"
            exit 1
          fi

      - name: Checkout private data
        uses: actions/checkout@v4
        with:
          repository: in4lio/run4221-private
          ref: ${{ inputs.private_ref }}
          path: private-source
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}

      - name: Validate private data files
        shell: bash
        run: |
          set -euo pipefail
          test -f private-source/prompts/discover_event_profile.instructions.txt
          test -f private-source/prompts/research_agent.instructions.txt
          test -f private-source/prompts/update_registration_window.instructions.txt
          if [[ "${{ inputs.action }}" == "reset-and-seed-suggestions" ]]; then
            test -f private-source/data/launch_suggestions.json
          fi

      - name: Configure VPS SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync private data to VPS
        shell: bash
        run: |
          set -euo pipefail
          remote_private_dir="${{ secrets.VPS_APP_DIR }}/private"
          tar -C private-source -czf - data prompts | ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "umask 077 \
              && mkdir -p '$remote_private_dir' \
              && tar -C '$remote_private_dir' -xzf - \
              && chmod 700 '$remote_private_dir' \
                '$remote_private_dir/data' '$remote_private_dir/prompts' \
              && find '$remote_private_dir/data' '$remote_private_dir/prompts' \
                -type f -exec chmod 600 {} +"

      - name: Seed prompts
        if: ${{ inputs.action == 'seed-prompts' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "APP_DIR='${{ secrets.VPS_APP_DIR }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          restart_services() {
            status="$?"
            trap - ERR
            echo "Prompt seeding failed; restarting stopped services." >&2
            docker compose up -d --no-build --wait --wait-timeout 90 || true
            docker compose ps || true
            exit "$status"
          }
          trap restart_services ERR
          docker compose stop bot researcher
          docker compose run --rm -T --interactive=false \
            -v "$PWD/private:/app/private:ro" \
            bot uv run python -m run4221.db.seed_prompts \
              --prompts-dir private/prompts \
              --database-url sqlite:///data/run4221.sqlite3
          docker compose up -d --wait --wait-timeout 90
          trap - ERR
          docker compose ps
          REMOTE

      - name: Reset database and seed suggestions
        if: ${{ inputs.action == 'reset-and-seed-suggestions' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "APP_DIR='${{ secrets.VPS_APP_DIR }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          backup_path=""
          restore_needed=false
          recover_reset() {
            status="$?"
            trap - ERR
            echo "Reset bootstrap failed; recovering services." >&2
            if [[ "$restore_needed" == "true" && -s "$backup_path" ]]; then
              echo "Restoring pre-reset database backup." >&2
              cp -f "$backup_path" data/run4221.sqlite3 || true
              rm -f data/run4221.sqlite3-wal data/run4221.sqlite3-shm || true
            fi
            docker compose up -d --no-build --wait --wait-timeout 90 || true
            docker compose ps || true
            exit "$status"
          }
          trap recover_reset ERR
          docker compose stop bot researcher
          mkdir -p data/backups
          if [[ -f data/run4221.sqlite3 ]]; then
            backup_path="data/backups/run4221.$(date -u +%Y%m%dT%H%M%SZ).pre-reset.sqlite3"
            docker compose run --rm -T --interactive=false --no-deps bot uv run python -c \
              'import sqlite3, sys; source = sqlite3.connect("data/run4221.sqlite3"); checkpoint = source.execute("PRAGMA wal_checkpoint(TRUNCATE)").fetchone(); assert checkpoint is not None and checkpoint[0] == 0; assert source.execute("PRAGMA integrity_check").fetchone()[0] == "ok"; backup = sqlite3.connect(sys.argv[1]); source.backup(backup); backup.close(); source.close(); check = sqlite3.connect(sys.argv[1]); assert check.execute("PRAGMA integrity_check").fetchone()[0] == "ok"; check.close()' \
              "$backup_path"
            test -s "$backup_path"
            test ! -s data/run4221.sqlite3-wal
            restore_needed=true
            rm -f data/run4221.sqlite3-wal data/run4221.sqlite3-shm
          fi
          docker compose run --rm -T --interactive=false \
            -v "$PWD/private:/app/private:ro" \
            bot uv run python -m run4221.db.seed_suggestions \
              --input private/data/launch_suggestions.json \
              --database-url sqlite:///data/run4221.sqlite3 \
              --reset-sqlite \
              --confirm-reset RESET_SUGGESTION_BOOTSTRAP
          restore_needed=false
          docker compose up -d --build --remove-orphans --wait --wait-timeout 90
          trap - ERR
          docker compose ps
          REMOTE
