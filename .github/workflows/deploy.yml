name: Deploy

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: production-mutation
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Verify selected commit
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev --extra researcher
          uv run ruff check
          uv run pytest
          docker compose config --quiet

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy selected commit
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "DEPLOY_SHA='${{ github.sha }}' APP_DIR='${{ secrets.VPS_APP_DIR }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          previous_sha="$(git rev-parse HEAD)"
          previous_services="$(docker compose config --services 2>/dev/null || true)"
          previous_bot_container="$(docker compose ps -q bot 2>/dev/null || true)"
          previous_researcher_container="$(docker compose ps -q researcher 2>/dev/null || true)"
          previous_bot_image=""
          previous_researcher_image=""
          previous_bot_rollback_tag=""
          previous_researcher_rollback_tag=""
          if [[ -n "$previous_bot_container" ]]; then
            previous_bot_image="$(docker inspect --format '{{.Image}}' "$previous_bot_container")"
            previous_bot_rollback_tag="run4221-bot:rollback-$previous_sha"
            docker image tag "$previous_bot_image" "$previous_bot_rollback_tag"
          fi
          if [[ -n "$previous_researcher_container" ]]; then
            previous_researcher_image="$(docker inspect --format '{{.Image}}' "$previous_researcher_container")"
            previous_researcher_rollback_tag="run4221-researcher:rollback-$previous_sha"
            docker image tag "$previous_researcher_image" "$previous_researcher_rollback_tag"
          fi
          service_replaced=false
          rollback() {
            status="$?"
            trap - ERR
            git checkout --detach "$previous_sha"
            git reset --hard "$previous_sha"
            if [[ -n "$previous_bot_rollback_tag" ]]; then
              docker image tag "$previous_bot_rollback_tag" run4221-bot:latest
            fi
            if [[ -n "$previous_researcher_rollback_tag" ]] \
              && grep -qx researcher <<<"$previous_services"; then
              docker image tag "$previous_researcher_rollback_tag" run4221-researcher:latest
            fi
            if [[ "$service_replaced" == "true" ]]; then
              docker compose up -d --no-build --remove-orphans --wait --wait-timeout 90
            fi
            docker compose ps
            exit "$status"
          }
          trap rollback ERR
          git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout --detach "$DEPLOY_SHA"
          git reset --hard "$DEPLOY_SHA"
          docker compose config --quiet
          docker compose run --rm -T --build bot uv run python -m run4221.health
          docker compose run --rm -T --build --no-deps researcher \
            uv run run4221-researcher --check-config
          docker compose run --rm -T --no-deps researcher uv run python -c \
            'from run4221.researcher.config import ResearcherSettings; s = ResearcherSettings(); assert not s.enabled and not s.discovery_enabled and not s.rendering_enabled, "researcher must deploy ready-paused"'
          service_replaced=true
          docker compose stop researcher
          docker compose up -d --build --no-deps --wait --wait-timeout 90 bot
          docker compose exec -T bot uv run python -m run4221.health
          docker compose up -d --build --remove-orphans --wait --wait-timeout 90
          docker compose ps
          docker compose exec -T bot uv run python -m run4221.health
          docker compose exec -T researcher uv run python -m run4221.researcher.health
          docker compose exec -T researcher uv run python -c \
            'import json; state = json.load(open("data/researcher_health.json", encoding="utf-8")); assert state["mode"] == "paused" and state["activity"] == "idle"; print("researcher_consecutive_failures=" + str(state["consecutive_failures"]))'
          trap - ERR
          REMOTE
