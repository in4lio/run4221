name: Deploy

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: production-mutation
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Verify selected commit
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev
          uv run ruff check
          uv run pytest

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy selected commit
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "DEPLOY_SHA='${{ github.sha }}' APP_DIR='${{ secrets.VPS_APP_DIR }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          previous_sha="$(git rev-parse HEAD)"
          rollback() {
            status="$?"
            trap - ERR
            git checkout --detach "$previous_sha"
            git reset --hard "$previous_sha"
            docker compose up -d --build --remove-orphans --wait --wait-timeout 90
            docker compose ps
            exit "$status"
          }
          trap rollback ERR
          git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git checkout --detach "$DEPLOY_SHA"
          git reset --hard "$DEPLOY_SHA"
          docker compose up -d --build --remove-orphans --wait --wait-timeout 90
          docker compose ps
          docker compose exec -T bot uv run python -m run4221.health
          trap - ERR
          REMOTE
