services:
  bot:
    build: .
    image: run4221-bot:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-m", "run4221.health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
