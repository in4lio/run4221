services:
  bot:
    build:
      context: .
      target: bot
    image: run4221-bot:latest
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${BOT_ENV_FILE:-./private/runtime/bot.env}
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - ./data:/app/data
      - ./private/prompts:/app/private/prompts:ro
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-m", "run4221.health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  researcher:
    build:
      context: .
      target: researcher
    image: run4221-researcher:latest
    restart: unless-stopped
    command: ["uv", "run", "run4221-researcher", "--loop"]
    depends_on:
      bot:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${RESEARCHER_ENV_FILE:-./private/runtime/researcher.env}
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - ./data:/app/data
      - ./private/prompts:/app/private/prompts:ro
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-m", "run4221.researcher.health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
